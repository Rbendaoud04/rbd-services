server:
  port: 8084
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/customers/**

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka

  management:
    tracing:
      sampling:
        probability: 1.0   # send 100% of traces
      export:
        zipkin:
          enabled: true
          endpoint: http://localhost:9411/api/v2/spans

      baggage:
        enabled: true
        remote-fields: userId,tenantId
        correlation:
          enabled: true
          fields: userId,tenantId  # Add to MDC
      propagation:
        type: b3

  logging:
    pattern:
      level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"

